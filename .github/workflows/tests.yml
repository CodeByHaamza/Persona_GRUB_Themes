name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Ubuntu 22.04 : la plus récente qui propose encore Python 3.8 (le minimum annoncé dans le README)
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the dev tools
        run: pip install pillow pyflakes

      - name: Lint
        run: python -m pyflakes install.py install_ui.py install_i18n.py tools tests

      - name: Tests (installer, interface, themes, languages)
        run: python -m unittest discover -s tests -v

      - name: Theme readability
        run: python tools/check_contrast.py
